<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>humanoid-lab · Humanoide remoto</title>
<meta name="description" content="Laboratório remoto e realista de um robô humanoide programável: física de corpos rígidos, atuadores, bateria, sensores com ruído, firmware de equilíbrio e SDK em JavaScript.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305080c'/%3E%3Cpath d='M10 7v18M22 7v18M10 17h12' fill='none' stroke='%23ff7a1a' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='10.5' r='2.4' fill='%2337d5ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#05080c; --panel:#0a1016; --panel2:#0d141b; --panel3:#101922; --line:#18222d; --line2:#243241;
  --ink:#d9e3ec; --ink2:#9fb0c0; --mute:#6b7d8f;
  --cyan:#37d5ff; --amber:#ffb020; --green:#4dff91; --rose:#ff4d6d; --violet:#9d86ff; --orange:#ff7a1a;
  --ui:'Chakra Petch', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --serif:'Instrument Serif', Georgia, serif;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13px;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.mono{font-family:var(--mono)}
.mute{color:var(--mute)}
/* ---------------------------------------------------------------- topo */
.top{height:54px;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#081018,#05080c)}
.brand{display:flex;align-items:center;gap:10px;min-width:230px}
.brand svg{flex:none}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.14em}
.brand h1 span{color:var(--orange)}
.brand small{display:block;font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.04em;margin-top:1px}
.chips{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
.chip{display:flex;flex-direction:column;justify-content:center;padding:3px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);min-width:78px}
.chip b{font-family:var(--mono);font-weight:500;font-size:12.5px;white-space:nowrap}
.chip em{font-style:normal;font-size:9.5px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.chip.ok b{color:var(--green)} .chip.warn b{color:var(--amber)} .chip.bad b{color:var(--rose)} .chip.info b{color:var(--cyan)} .chip.vio b{color:var(--violet)}
.simctl{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);padding:6px 10px;border-radius:var(--r);font-weight:500;letter-spacing:.03em;transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel3);border-color:#34475a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{border-color:#1d5c73;background:#0c2330;color:var(--cyan)}
.btn.warn{border-color:#6a4a10;background:#231805;color:var(--amber)}
.btn.good{border-color:#1b5a36;background:#082014;color:var(--green)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.on{border-color:var(--cyan);color:var(--cyan)}
select.btn{padding:5px 6px}
.estop{width:92px;height:40px;white-space:nowrap;border-radius:8px;border:2px solid #ff4d6d;background:radial-gradient(circle at 50% 35%,#ff5c78,#b3122f 70%);color:#fff;font-weight:700;letter-spacing:.12em;box-shadow:0 0 0 3px #3a0b14, 0 6px 18px rgba(255,77,109,.25)}
.estop:hover{filter:brightness(1.08)}
.estop small{display:block;font-size:8.5px;letter-spacing:.14em;font-weight:500;opacity:.85}
/* ---------------------------------------------------------------- grade */
.grid{display:grid;grid-template-columns:292px minmax(0,1fr) 468px;height:calc(100% - 54px)}
.panel{background:var(--panel);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#223040 transparent}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sec{border-bottom:1px solid var(--line);padding:11px 12px}
.sec h2{margin:0 0 8px;font-size:10.5px;letter-spacing:.18em;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.sec h2 .n{font-family:var(--mono);color:var(--orange);font-size:10px}
.sec h2 .aux{margin-left:auto;font-family:var(--mono);letter-spacing:0;color:var(--mute);font-weight:400;text-transform:none}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-family:var(--mono);font-size:11.5px}
.kv span:nth-child(odd){color:var(--mute)}
.kv span:nth-child(even){text-align:right}
/* checklist */
.check{list-style:none;margin:0;padding:0;counter-reset:c}
.check li{display:flex;gap:9px;align-items:flex-start;padding:5px 0;color:var(--mute);font-size:12.5px;line-height:1.3}
.check li i{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid #2c3a48;margin-top:1px;display:grid;place-items:center;font-style:normal;font-size:10px}
.check li.done{color:var(--ink2)} .check li.done i{border-color:var(--green);background:#0b2a18;color:var(--green)}
.check li.now{color:var(--ink)} .check li.now i{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,176,32,.12)}
.check li small{display:block;color:var(--mute);font-size:11px;margin-top:1px}
/* sliders */
.sl{display:grid;grid-template-columns:78px 1fr 58px;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.sl label{color:var(--ink2)}
.sl output{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--cyan);height:18px}
/* pad de teleoperação */
.teleop{display:grid;grid-template-columns:132px 1fr;gap:10px;align-items:center}
.pad{position:relative;width:132px;height:132px;border-radius:10px;border:1px solid var(--line2);background:radial-gradient(circle,#0f1a24 0,#0a1016 70%);touch-action:none;cursor:grab}
.pad::before,.pad::after{content:'';position:absolute;background:#1c2835}
.pad::before{left:50%;top:10px;bottom:10px;width:1px}
.pad::after{top:50%;left:10px;right:10px;height:1px}
.knob{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;left:50%;top:50%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5de0ff,#137aa0);box-shadow:0 0 0 2px #05080c,0 0 12px rgba(55,213,255,.35);pointer-events:none}
.pad .lbl{position:absolute;font-family:var(--mono);font-size:9px;color:var(--mute)}
.kbd{display:inline-block;font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink2)}
/* centro */
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.viewport{position:relative;flex:1;min-height:0;outline:none}
.viewport canvas{display:block;width:100%;height:100%}
.hud{position:absolute;pointer-events:none;font-family:var(--mono);font-size:11px}
.hud.tl{left:12px;top:10px}
.hud.tr{right:10px;top:10px;pointer-events:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hud.bl{left:12px;bottom:10px}
.mode{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line2);border-radius:var(--r);background:rgba(5,8,12,.78);backdrop-filter:blur(4px)}
.mode b{font-family:var(--ui);font-size:16px;letter-spacing:.12em}
.mode .dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.hudline{margin-top:6px;padding:4px 8px;background:rgba(5,8,12,.7);border:1px solid var(--line);border-radius:var(--r);color:var(--ink2);line-height:1.55}
.hudline span{color:var(--ink)}
.toggles{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:420px}
.tg{border:1px solid var(--line2);background:rgba(10,16,22,.85);color:var(--mute);border-radius:20px;padding:3px 9px;font-size:11px;font-family:var(--mono)}
.tg.on{color:var(--ink);border-color:#35506a}
.tg .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:4px 8px;background:rgba(5,8,12,.7);border:1px solid var(--line);border-radius:var(--r);color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.toasts{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:5}
.toast{padding:7px 12px;border-radius:var(--r);background:rgba(10,16,22,.95);border:1px solid var(--line2);font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .2s ease-out}
.toast.warn{border-color:#6a4a10;color:var(--amber)} .toast.err{border-color:#6c1a2a;color:var(--rose)} .toast.ok{border-color:#1b5a36;color:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
.banner{position:absolute;inset:auto 0 0 0;display:none;justify-content:center;pointer-events:none;padding-bottom:46px}
.banner div{padding:10px 18px;border:2px solid var(--rose);background:rgba(40,6,14,.9);color:#ffd6dd;border-radius:8px;font-weight:600;letter-spacing:.08em}
/* log */
.log{height:152px;border-top:1px solid var(--line);background:#070b10;display:flex;flex-direction:column}
.loghead{display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid var(--line)}
.loghead b{font-size:10.5px;letter-spacing:.18em;color:var(--ink2);font-weight:600;margin-right:6px}
.logbody{flex:1;overflow-y:auto;padding:4px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.55;scrollbar-width:thin;scrollbar-color:#223040 transparent}
.logbody div{white-space:pre-wrap;word-break:break-word}
.logbody .t{color:var(--mute)} .logbody .src{display:inline-block;width:40px;color:var(--mute)}
.l-info{color:var(--ink2)} .l-warn{color:var(--amber)} .l-err{color:var(--rose)} .l-ok{color:var(--green)} .l-prog{color:var(--ink)}
/* abas */
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
.tab{flex:1;border:0;background:none;padding:11px 4px;color:var(--mute);font-weight:600;font-size:11px;letter-spacing:.14em;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--orange)}
.pane{display:none;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#223040 transparent}
.pane.on{display:flex;flex-direction:column}
/* editor */
.progbar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.progbar select{flex:1;min-width:150px}
.ed{position:relative;flex:1;min-height:260px;display:grid;grid-template-columns:40px 1fr;background:#070b10;font-family:var(--mono);font-size:12.5px;line-height:19px;overflow:hidden}
.ed-gutter{padding:10px 8px 10px 0;text-align:right;color:#3c4d5e;user-select:none;border-right:1px solid var(--line)}
.ed-gutter .err{color:#fff;background:#6c1a2a;border-radius:3px}
.ed-body{position:relative;overflow:hidden}
.ed-hl,.ed-ta{margin:0;padding:10px 12px;font:inherit;line-height:inherit;white-space:pre;tab-size:2;letter-spacing:0;word-spacing:0}
.ed-hl{position:absolute;inset:0;pointer-events:none;color:#c9d6e2}
.ed-ta{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;background:transparent;color:transparent;caret-color:var(--cyan);outline:none;overflow:auto}
.ed-ta::selection{background:rgba(55,213,255,.22)}
.tk-c{color:#5f7385;font-style:italic} .tk-s{color:#9ee6a8} .tk-n{color:#ffb86b} .tk-k{color:#ff7a9a} .tk-l{color:#ffb86b} .tk-a{color:#37d5ff;font-weight:500} .tk-f{color:#e3d17a} .tk-p{color:#b9c7d6}
.progstat{display:flex;gap:10px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--mute);flex-wrap:wrap}
.progstat .st{padding:2px 7px;border-radius:4px;border:1px solid var(--line2);color:var(--ink2)}
.progstat .st.run{color:var(--green);border-color:#1b5a36}
.progstat .st.err{color:var(--rose);border-color:#6c1a2a}
.exdesc{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--ink2);font-size:12px;line-height:1.45;background:var(--panel2)}
/* gráficos */
.charts{padding:8px 10px 14px;display:flex;flex-direction:column;gap:10px}
.chart{position:relative;border:1px solid var(--line);border-radius:var(--r);background:#0b1117;padding:6px 8px 4px}
.chart-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.chart-title{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink)}
.chart-unit{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.chart-legend{margin-left:auto;display:flex;gap:10px;font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
.chart-legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.chart-canvas{display:block;width:100%;margin-top:4px}
.chart-tip{position:absolute;display:none;pointer-events:none;background:rgba(5,8,12,.95);border:1px solid var(--line2);border-radius:5px;padding:5px 8px;font-family:var(--mono);font-size:11px;z-index:3;min-width:150px}
.chart-tip .tip-t{color:var(--mute);margin-bottom:2px}
.chart-tip div{display:flex;align-items:center;gap:6px;color:var(--ink2)} .chart-tip b{margin-left:auto;color:var(--ink);font-weight:500}
.chart-tip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.suppwrap{display:grid;grid-template-columns:1fr 150px;gap:8px}
.supp{width:100%;height:210px;display:block;border:1px solid var(--line);border-radius:var(--r);background:#0b1117}
.supplegend{font-family:var(--mono);font-size:10.5px;color:var(--ink2);line-height:1.8}
.supplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ro{border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:#0b1117}
.ro em{display:block;font-style:normal;font-size:9.5px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.ro b{font-family:var(--mono);font-weight:500;font-size:15px}
.ro small{font-family:var(--mono);color:var(--mute);font-size:10.5px;margin-left:3px}
/* tabela de juntas */
table.jt{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
.jt th{position:sticky;top:0;background:var(--panel);text-align:right;color:var(--mute);font-weight:400;padding:7px 6px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.06em}
.jt th:first-child,.jt td:first-child{text-align:left}
.jt td{padding:4px 6px;border-bottom:1px solid #111a23;text-align:right;white-space:nowrap}
.jt td.nm{color:var(--ink2)}
.jt .bar{position:relative;width:62px;height:8px;background:#111a23;border-radius:2px;display:inline-block;vertical-align:middle;overflow:hidden}
.jt .bar i{position:absolute;top:0;bottom:0;background:#1b9fce}
.jt .bar i.hot{background:#c98500} .jt .bar i.sat{background:#d9426f}
.jt .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#2a3a4a}
.jt .lim{color:var(--rose)}
.jt .grp td{color:var(--orange);font-size:9.5px;letter-spacing:.16em;padding-top:10px;border-bottom:1px solid var(--line)}
/* missões */
.missions{padding:10px;display:flex;flex-direction:column;gap:8px}
.mis{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#0b1117;display:grid;grid-template-columns:28px 1fr;gap:4px 10px}
.mis .ic{grid-row:span 3;width:26px;height:26px;border-radius:50%;border:1.5px solid #2c3a48;display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--mute)}
.mis.done{border-color:#1b5a36} .mis.done .ic{border-color:var(--green);background:#0b2a18;color:var(--green)}
.mis.act .ic{border-color:var(--amber);color:var(--amber)}
.mis h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.04em}
.mis p{margin:0;color:var(--ink2);font-size:12px;line-height:1.4}
.prog{height:5px;background:#111a23;border-radius:3px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--amber);width:0}
.mis.done .prog i{background:var(--green)}
.mis .hint{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.cert{margin:4px 10px 14px;border:1px solid #6a4a10;border-radius:10px;padding:16px;background:radial-gradient(circle at 20% 0,#1d1606,#0b1117 60%);text-align:center}
.cert h3{font-family:var(--serif);font-weight:400;font-style:italic;font-size:28px;margin:4px 0;color:#ffe2a3}
.cert p{color:var(--ink2);margin:4px 0}
.cert input{background:#070b10;border:1px solid var(--line2);border-radius:5px;padding:6px 8px;text-align:center;width:80%}
/* manual */
.doc{padding:12px 16px 30px;line-height:1.55;font-size:13px;color:var(--ink2)}
.doc h3{font-family:var(--serif);font-weight:400;font-size:24px;color:var(--ink);margin:18px 0 6px}
.doc h3:first-child{margin-top:4px}
.doc h4{margin:16px 0 4px;color:var(--ink);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase}
.doc code{font-family:var(--mono);font-size:11.5px;background:#0f1822;border:1px solid #182330;border-radius:4px;padding:0 4px;color:#cfe3f2}
.doc pre{font-family:var(--mono);font-size:11.5px;background:#070b10;border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;color:#c9d6e2}
.doc table{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0}
.doc td,.doc th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.doc th{color:var(--mute);font-weight:500}
.doc td code{white-space:nowrap}
.doc .note{border-left:3px solid var(--amber);padding:6px 10px;background:#140f05;color:#e9d6ad;border-radius:0 6px 6px 0;margin:8px 0}
.doc ul{padding-left:18px;margin:6px 0}
/* responsivo */
@media (max-width:1320px){.grid{grid-template-columns:268px minmax(0,1fr) 410px}.chip.opt{display:none}}
@media (max-width:1060px){
  body{overflow:auto}
  .grid{display:flex;flex-direction:column;height:auto}
  .center{order:1}.left{order:2;border-right:0}.right{order:3;border-left:0;min-height:80vh}
  .viewport{height:58vh;flex:none}
  .top{height:auto;flex-wrap:wrap;padding:8px 12px;gap:8px}
  .chips{order:3;flex-basis:100%;overflow-x:auto}
  .brand{min-width:0}
}
@media (max-width:560px){
  .brand small{display:none}.estop{width:auto;padding:0 12px;white-space:nowrap}.simctl .btn.sm{padding:4px 6px}.suppwrap{grid-template-columns:1fr}
  .hud.tr .toggles:first-child{display:none}.hud.bl{display:none}
  .hud.tr{top:auto;bottom:8px;right:8px}
  .hudline{font-size:10px;line-height:1.5}.mode b{font-size:14px}
  .readout{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header class="top">

  } else if (R[4] > R[8]) {
    const s = Math.sqrt(1 + R[4] - R[0] - R[8]) * 2; o[0] = (R[2] - R[6]) / s; o[1] = (R[1] + R[3]) / s; o[2] = 0.25 * s; o[3] = (R[5] + R[7]) / s;
  } else {
    const s = Math.sqrt(1 + R[8] - R[0] - R[4]) * 2; o[0] = (R[3] - R[1]) / s; o[1] = (R[2] + R[6]) / s; o[2] = (R[5] + R[7]) / s; o[3] = 0.25 * s;
  }
  return quatNormalize(o);
}
function quatMul(a, b, o) {
  const w = a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3];
  const x = a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2];
  const y = a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1];
  const z = a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0];
  o[0] = w; o[1] = x; o[2] = y; o[3] = z; return o;
}
function quatNormalize(q) { const n = Math.hypot(q[0], q[1], q[2], q[3]); q[0] /= n; q[1] /= n; q[2] /= n; q[3] /= n; return q; }
const _qtmp = new Float64Array(4);
function quatIntegrateBody(q, wx, wy, wz, dt) { // q <- q ⊗ exp(ω dt / 2), ω no frame do corpo
  const th = Math.hypot(wx, wy, wz) * dt;
  let s, c;
  if (th < 1e-9) { s = 0.5 * dt; c = 1; } else { s = Math.sin(th * 0.5) / (th / dt); c = Math.cos(th * 0.5); }
  _qtmp[0] = c; _qtmp[1] = wx * s; _qtmp[2] = wy * s; _qtmp[3] = wz * s;
  quatMul(q, _qtmp, q); quatNormalize(q); return q;
}

// ------------------------------------------------------------- álgebra espacial
// Vetores de movimento m = [w; v] e de força f = [n; f] em coordenadas do mundo,
// referidos à origem do mundo. Inércia espacial composta armazenada como
// (massa, h = m*c, I_O = inércia rotacional em torno da origem).
function sdot(m, mo, f, fo) { // m·f
  return m[mo] * f[fo] + m[mo + 1] * f[fo + 1] + m[mo + 2] * f[fo + 2] + m[mo + 3] * f[fo + 3] + m[mo + 4] * f[fo + 4] + m[mo + 5] * f[fo + 5];
}
// Inércia (m, h, I) aplicada a movimento (w, v) -> força (n, f)
//   n = I w + h x v ; f = m v - h x w
function sinertiaMul(m, h, I, mv, mo, out, oo) {
  const wx = mv[mo], wy = mv[mo + 1], wz = mv[mo + 2], vx = mv[mo + 3], vy = mv[mo + 4], vz = mv[mo + 5];
  const hx = h[0], hy = h[1], hz = h[2];
  out[oo] = I[0] * wx + I[1] * wy + I[2] * wz + (hy * vz - hz * vy);
  out[oo + 1] = I[3] * wx + I[4] * wy + I[5] * wz + (hz * vx - hx * vz);
  out[oo + 2] = I[6] * wx + I[7] * wy + I[8] * wz + (hx * vy - hy * vx);
  out[oo + 3] = m * vx - (hy * wz - hz * wy);
  out[oo + 4] = m * vy - (hz * wx - hx * wz);
  out[oo + 5] = m * vz - (hx * wy - hy * wx);
}
// m1 x_m m2 = [w1 x w2 ; w1 x v2 + v1 x w2]
function scrossM(a, ao, b, bo, out, oo) {
  const w1x = a[ao], w1y = a[ao + 1], w1z = a[ao + 2], v1x = a[ao + 3], v1y = a[ao + 4], v1z = a[ao + 5];
  const w2x = b[bo], w2y = b[bo + 1], w2z = b[bo + 2], v2x = b[bo + 3], v2y = b[bo + 4], v2z = b[bo + 5];
  out[oo] = w1y * w2z - w1z * w2y; out[oo + 1] = w1z * w2x - w1x * w2z; out[oo + 2] = w1x * w2y - w1y * w2x;
  out[oo + 3] = (w1y * v2z - w1z * v2y) + (v1y * w2z - v1z * w2y);
  out[oo + 4] = (w1z * v2x - w1x * v2z) + (v1z * w2x - v1x * w2z);
  out[oo + 5] = (w1x * v2y - w1y * v2x) + (v1x * w2y - v1y * w2x);
}
// m x* f = [w x n + v x f ; w x f]
function scrossF(m, mo, f, fo, out, oo) {
  const wx = m[mo], wy = m[mo + 1], wz = m[mo + 2], vx = m[mo + 3], vy = m[mo + 4], vz = m[mo + 5];
  const nx = f[fo], ny = f[fo + 1], nz = f[fo + 2], fx = f[fo + 3], fy = f[fo + 4], fz = f[fo + 5];
  out[oo] = (wy * nz - wz * ny) + (vy * fz - vz * fy);
  out[oo + 1] = (wz * nx - wx * nz) + (vz * fx - vx * fz);
  out[oo + 2] = (wx * ny - wy * nx) + (vx * fy - vy * fx);
  out[oo + 3] = wy * fz - wz * fy; out[oo + 4] = wz * fx - wx * fz; out[oo + 5] = wx * fy - wy * fx;
}

// ------------------------------------------------------ Cholesky densa (n x n)
function cholFactor(A, n, L) { // A simétrica definida positiva -> L (triangular inferior)
  for (let i = 0; i < n; i++) {
    for (let j = 0; j <= i; j++) {
      let s = A[i * n + j];
      const ii = i * n, jj = j * n;
      for (let k = 0; k < j; k++) s -= L[ii + k] * L[jj + k];
      if (i === j) {
        if (s <= 1e-12) s = 1e-12;
        L[ii + i] = Math.sqrt(s);
      } else L[ii + j] = s / L[jj + j];
    }
    for (let j = i + 1; j < n; j++) L[i * n + j] = 0;
  }
}
function cholSolve(L, n, b, x) { // resolve L L^T x = b
  for (let i = 0; i < n; i++) {
    let s = b[i]; const ii = i * n;
    for (let k = 0; k < i; k++) s -= L[ii + k] * x[k];
    x[i] = s / L[ii + i];
  }
  for (let i = n - 1; i >= 0; i--) {
    let s = x[i];
    for (let k = i + 1; k < n; k++) s -= L[k * n + i] * x[k];
    x[i] = s / L[i * n + i];
  }
  return x;
}
